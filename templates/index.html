<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            padding: 12px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .template-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .template-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .template-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .template-card.selected {
            border-color: #667eea;
            background-color: #f5f7ff;
        }

        .template-card h3 {
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .template-card p {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .template-card .category {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .documents-list {
            margin-top: 20px;
        }

        .document-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }

        .document-info {
            flex: 1;
        }

        .document-info h4 {
            color: #333;
            margin-bottom: 3px;
        }

        .document-info p {
            color: #999;
            font-size: 12px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-small:hover {
            background-color: #45a049;
        }

        .dynamic-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 10px;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Documentation Generator</h1>
        <p class="subtitle">Create professional Word documents from templates</p>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab(event, 'word-generator')">📄 Word Generator</button>
            <button class="tab-button" onclick="switchTab(event, 'classic-generator')">✏️ Classic Generator</button>
            <button class="tab-button" onclick="switchTab(event, 'documents')">📁 Generated Documents</button>
        </div>

        <!-- Word Document Generator Tab -->
        <div id="word-generator" class="tab-content active">
            <h2 style="color: #333; margin-bottom: 20px;">Select a Template</h2>
            <div id="templates-container" class="template-selector">
                <p>Loading templates...</p>
            </div>

            <div id="form-container" class="dynamic-form" style="display: none;">
                <h3 style="color: #333; margin-bottom: 20px;">Fill in the form</h3>
                <form id="dynamic-form"></form>
                <div class="button-group">
                    <button type="button" class="btn-primary" onclick="generateWordDocument()">
                        <span class="spinner" id="spinner-word"></span>
                        Generate Word Document
                    </button>
                    <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
                </div>
                <div class="status-message" id="word-status"></div>
            </div>
        </div>

        <!-- Classic Generator Tab -->
        <div id="classic-generator" class="tab-content">
            <div class="content-wrapper">
                <div class="input-section">
                    <label for="docType">Documentation Type:</label>
                    <select id="docType">
                        <option value="markdown">Markdown</option>
                        <option value="html">HTML</option>
                    </select>
                    <label for="inputContent">Paste your content here:</label>
                    <textarea id="inputContent" placeholder="Enter your content..."></textarea>
                </div>
                <div class="output-section">
                    <label for="outputContent">Generated Documentation:</label>
                    <textarea id="outputContent" readonly placeholder="Output will appear here..."></textarea>
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="generateDocumentation()">
                    <span class="spinner" id="spinner-classic"></span>
                    Generate
                </button>
                <button class="btn-secondary" onclick="copyToClipboard()">Copy Output</button>
            </div>
            <div class="status-message" id="classic-status"></div>
        </div>

        <!-- Generated Documents Tab -->
        <div id="documents" class="tab-content">
            <h2 style="color: #333; margin-bottom: 20px;">Generated Documents</h2>
            <div id="documents-list" class="documents-list">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script>
        {% raw %}
        let selectedTemplateId = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadTemplates();
            loadDocuments();
        });

        function switchTab(event, tabName) {
            event.preventDefault();
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            if (tabName === 'documents') loadDocuments();
        }

        async function loadTemplates() {
            try {
                const response = await fetch('/api/templates');
                const data = await response.json();
                const container = document.getElementById('templates-container');
                if (data.success && data.templates.length > 0) {
                    container.innerHTML = data.templates.map(t => `
                        <div class="template-card" onclick="selectTemplate(${t.id}, '${t.name}', ${JSON.stringify(t.fields)})">
                            <h3>${t.name}</h3>
                            <p>${t.description}</p>
                            <span class="category">${t.category}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function selectTemplate(id, name, fields) {
            selectedTemplateId = id;
            generateDynamicForm(fields);
            document.getElementById('form-container').style.display = 'block';
        }

        function generateDynamicForm(fields) {
            const form = document.getElementById('dynamic-form');
            form.innerHTML = fields.map(f => {
                const required = f.required ? 'required' : '';
                if (f.type === 'textarea') {
                    return `<div class="form-group"><label>${f.label}</label><textarea name="${f.name}" ${required}></textarea></div>`;
                } else if (f.type === 'select') {
                    return `<div class="form-group"><label>${f.label}</label><select name="${f.name}" ${required}><option>--Select--</option>${f.options.map(o => `<option>${o}</option>`).join('')}</select></div>`;
                } else {
                    return `<div class="form-group"><label>${f.label}</label><input type="${f.type}" name="${f.name}" ${required} /></div>`;
                }
            }).join('');
        }

        async function generateWordDocument() {
            if (!selectedTemplateId) {
                showStatus('word-status', 'Please select a template', 'error');
                return;
            }
            const formData = new FormData(document.getElementById('dynamic-form'));
            const filledData = Object.fromEntries(formData);
            try {
                const response = await fetch('/api/generate-document', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({template_id: selectedTemplateId, filled_data: filledData})
                });
                const data = await response.json();
                if (response.ok) {
                    showStatus('word-status', 'Document generated!', 'success');
                    setTimeout(() => { window.location.href = data.download_url; loadDocuments(); }, 1000);
                } else {
                    showStatus('word-status', data.error, 'error');
                }
            } catch (error) {
                showStatus('word-status', 'Error: ' + error.message, 'error');
            }
        }

        async function generateDocumentation() {
            const content = document.getElementById('inputContent').value;
            const type = document.getElementById('docType').value;
            if (!content.trim()) {
                showStatus('classic-status', 'Please enter content', 'error');
                return;
            }
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content, type})
                });
                const data = await response.json();
                document.getElementById('outputContent').value = data.documentation;
                showStatus('classic-status', 'Generated!', 'success');
            } catch (error) {
                showStatus('classic-status', 'Error: ' + error.message, 'error');
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('outputContent');
            if (!output.value.trim()) {
                showStatus('classic-status', 'Nothing to copy', 'error');
                return;
            }
            output.select();
            document.execCommand('copy');
            showStatus('classic-status', 'Copied!', 'success');
        }

        function resetForm() {
            document.getElementById('dynamic-form').reset();
        }

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();
                const container = document.getElementById('documents-list');
                if (data.success && data.documents.length > 0) {
                    container.innerHTML = data.documents.map(d => `
                        <div class="document-item">
                            <div class="document-info">
                                <h4>${d.filename}</h4>
                                <p><strong>Template:</strong> ${d.template_name}</p>
                                <p><strong>Generated:</strong> ${new Date(d.generated_at).toLocaleDateString()}</p>
                            </div>
                            <a href="/api/download/${d.id}" class="btn-small">Download</a>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>No documents yet</p>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function showStatus(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `status-message ${type}`;
            setTimeout(() => { el.className = 'status-message'; }, 4000);
        }
        {% endraw %}
    </script>
</body>
</html>
